<!DOCTYPE html>
<html>
<head>
    <title>HealthVision Login</title>
 <style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(
    135deg,
    #4f46e5 0%,
    #06b6d4 50%,
    #10b981 100%
    );
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.login-box{
    width:400px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

.logo-icon{
    font-size:50px;
    text-align:center;
    margin-bottom:15px;
}

h2{
    text-align:center;
    margin-bottom:10px;
    color:#4f46e5;
    font-size:42px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:20px;
}

.features{
    margin-bottom:20px;
    color:#333;
    line-height:1.8;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(79,70,229,0.4);
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#2563eb;
    font-weight:600;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>

<div class="login-box">
   <div class="logo-icon">🩺</div>
   

<h2>HealthVision </h2>

<p class="subtitle">
Smart Disease Prediction Using AI & ML
</p>

<div class="features">
    <div>✅ 41 Diseases</div>
    <div>✅ 132 Symptoms</div>
    <div>✅ 93.2% Accuracy</div>
    <div>✅ Doctor Recommendation</div>
</div>

    <form method="POST">
        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
        
    </form>

    <p>
        New User?
        <a href="/register">Register Here</a>
    </p>
</div>

</body>
</html>
