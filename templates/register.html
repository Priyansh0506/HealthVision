<!DOCTYPE html>
<html>
<head>
    <title>Create Account | HealthVision</title>

    <style>
       body{
    font-family:Arial,sans-serif;
    background:linear-gradient(
    135deg,
    #4f46e5 0%,
    #06b6d4 50%,
    #10b981 100%
    );
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    padding:0;
}

        .register-box{
            width:400px;
            padding:40px;
            border-radius:25px;
            background:rgba(255,255,255,0.95);
            box-shadow:0 20px 50px rgba(0,0,0,0.3);
        }

        .logo-icon{
            font-size:50px;
            text-align:center;
            margin-bottom:15px;
        }

        h2{
            text-align:center;
            color:#4f46e5;
            font-size:36px;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#4f46e5;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(79,70,229,0.4);
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:600;
        }

        .login-link a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo-icon">🩺</div>

    <h2>Create Account</h2>

    <p class="subtitle">
        Join HealthVision and start smart disease prediction
    </p>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
