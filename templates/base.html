<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HealthVision{% endblock %}</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- common styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- page specific css -->
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- navbar -->
<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold" href="/">🩺 HealthVision</a>
    {% if session.username %}
    <div class="d-flex align-items-center gap-3">
        <span class="user-badge">👤 {{ session.username }}</span>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
    {% endif %}
</nav>

<!-- page content goes here -->
{% block content %}{% endblock %}

<!-- footer -->
<footer class="text-center py-4 mt-5">
    <p class="mb-0">© 2025 HealthVision &nbsp;|&nbsp; Disease Prediction System</p>
    <small>For Educational Purposes Only</small>
</footer>

<!-- bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- page specific js -->
{% block extra_js %}{% endblock %}

</body>
</html>
